<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rádio Amigos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section id="login">
            <h1>🎙️ Rádio Amigos</h1>

            <p>Entre para conversar com sua equipe.</p>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                maxlength="20"
                autocomplete="off"
            >

            <button id="entrar">
                Entrar
            </button>
        </section>

        <section id="sistema" class="oculto">

            <header>
                <div>
                    <h1>🎙️ Rádio Amigos</h1>
                    <p id="usuario-logado"></p>
                </div>

                <span id="status">
                    🟢 Online
                </span>
            </header>

            <div class="painel">

                <div class="card">
                    <h2>👥 Amigos online</h2>

                    <ul id="usuarios"></ul>
                </div>

                <div class="card">
                    <h2>🏠 Sala</h2>

                    <input
                        type="text"
                        id="nome-sala"
                        placeholder="Nome da sala"
                        maxlength="30"
                    >

                    <button id="criar-sala">
                        Criar sala
                    </button>

                    <div id="sala-atual">
                        Nenhuma sala selecionada
                    </div>
                </div>

                <div class="card comunicacao">

                    <h2>🎙️ Comunicação</h2>

                    <button id="falar" class="botao-falar">
                        🎙️ Falar
                    </button>

                    <button id="mutar" class="botao-mutar">
                        🔇 Mutar
                    </button>

                    <p id="microfone-status">
                        Microfone desligado
                    </p>

                </div>

            </div>

        </section>

    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>

</body>
</html>
